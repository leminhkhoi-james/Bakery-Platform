spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: subscription-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${IDENTITY_JWT_ISSUER:bakery-platform-identity}
  datasource:
    url: ${SUBSCRIPTION_DB_URL:jdbc:postgresql://localhost:5432/subscription}
    username: ${SUBSCRIPTION_DB_USERNAME:postgres}
    password: ${SUBSCRIPTION_DB_PASSWORD:12345}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

platform:
  remote:
    identity-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
    client-id: subscription-service
    client-secret: ${SUBSCRIPTION_CLIENT_SECRET:}
    connect-timeout: 2s
    read-timeout: 5s

security:
  jwt:
    user-audience: ${IDENTITY_JWT_USER_AUDIENCE:bakery-platform-api}
    service-audience: ${IDENTITY_JWT_SERVICE_AUDIENCE:subscription-service}

clients:
  bakery:
    url: ${BAKERY_SERVICE_URL:http://localhost:8082}
    service-token: ${SUBSCRIPTION_BAKERY_SERVICE_TOKEN:}

storage:
  minio:
    endpoint: ${SUBSCRIPTION_MINIO_ENDPOINT:}
    public-endpoint: ${SUBSCRIPTION_MINIO_PUBLIC_ENDPOINT:}
    access-key: ${SUBSCRIPTION_MINIO_ACCESS_KEY:}
    secret-key: ${SUBSCRIPTION_MINIO_SECRET_KEY:}
    bucket: ${SUBSCRIPTION_MINIO_BUCKET:subscription-proofs}

subscription:
  order-expiry-hours: 24
  vnpay:
    enabled: ${SUBSCRIPTION_VNPAY_ENABLED:true}
    tmn-code: ${SUBSCRIPTION_VNPAY_TMN_CODE:}
    hash-secret: ${SUBSCRIPTION_VNPAY_HASH_SECRET:}
    payment-url: ${SUBSCRIPTION_VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${SUBSCRIPTION_VNPAY_RETURN_URL:http://localhost:5173/subscription-vnpay-return}
    timeout-minutes: 15

server:
  forward-headers-strategy: framework
  port: ${SERVER_PORT:${SERVER_PORT_SUBSCRIPTION:${SUBSCRIPTION_SERVER_PORT:8084}}}


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
