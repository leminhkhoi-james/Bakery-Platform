spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

# =====================================
# Config Service URLs
# =====================================
services.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8081}
services.bakery.url=${BAKERY_SERVICE_URL:http://localhost:8082}
services.marketplace.url=${MARKETPLACE_SERVICE_URL:http://localhost:8083}
services.subscription.url=${SUBSCRIPTION_SERVICE_URL:http://localhost:8084}
services.cake-ai.url=${CAKE_AI_SERVICE_URL:http://localhost:8085}
services.order.url=${ORDER_SERVICE_URL:http://localhost:8086}
services.chat.url=${CHAT_SERVICE_URL:http://localhost:8087}

# =====================================
# Config API routes
# External API: /{service}/api/v1/**
# =====================================
spring.cloud.gateway.server.webmvc.routes[0].id=identity-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${services.identity.url}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/identity/api/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webmvc.routes[0].filters[1]=RewriteResponseHeader=Set-Cookie, Path=/api/v1/auth, Path=/identity/api/v1/auth

spring.cloud.gateway.server.webmvc.routes[1].id=bakery-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${services.bakery.url}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/bakery/api/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[2].id=marketplace-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${services.marketplace.url}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/marketplace/api/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[3].id=subscription-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${services.subscription.url}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/subscription/api/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[4].id=cake-ai-service
spring.cloud.gateway.server.webmvc.routes[4].uri=${services.cake-ai.url}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/cake-ai/api/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[5].id=order-service
spring.cloud.gateway.server.webmvc.routes[5].uri=${services.order.url}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/orders/api/**
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[6].id=chat-service
spring.cloud.gateway.server.webmvc.routes[6].uri=${services.chat.url}
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/chat/api/**
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=StripPrefix=1

# =====================================
# Config Swagger proxy routes
# =====================================
spring.cloud.gateway.server.webmvc.routes[7].id=identity-service-docs
spring.cloud.gateway.server.webmvc.routes[7].uri=${services.identity.url}
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/identity/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[7].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[7].filters[1]=PreserveHostHeader
spring.cloud.gateway.server.webmvc.routes[7].filters[2]=SetRequestHeader=X-Forwarded-Prefix, /identity

spring.cloud.gateway.server.webmvc.routes[8].id=bakery-service-docs
spring.cloud.gateway.server.webmvc.routes[8].uri=${services.bakery.url}
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/bakery/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[8].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[8].filters[1]=PreserveHostHeader
spring.cloud.gateway.server.webmvc.routes[8].filters[2]=SetRequestHeader=X-Forwarded-Prefix, /bakery

spring.cloud.gateway.server.webmvc.routes[9].id=marketplace-service-docs
spring.cloud.gateway.server.webmvc.routes[9].uri=${services.marketplace.url}
spring.cloud.gateway.server.webmvc.routes[9].predicates[0]=Path=/marketplace/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[9].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[9].filters[1]=PreserveHostHeader
spring.cloud.gateway.server.webmvc.routes[9].filters[2]=SetRequestHeader=X-Forwarded-Prefix, /marketplace

spring.cloud.gateway.server.webmvc.routes[10].id=subscription-service-docs
spring.cloud.gateway.server.webmvc.routes[10].uri=${services.subscription.url}
spring.cloud.gateway.server.webmvc.routes[10].predicates[0]=Path=/subscription/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[10].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[10].filters[1]=PreserveHostHeader
spring.cloud.gateway.server.webmvc.routes[10].filters[2]=SetRequestHeader=X-Forwarded-Prefix, /subscription

spring.cloud.gateway.server.webmvc.routes[11].id=cake-ai-service-docs
spring.cloud.gateway.server.webmvc.routes[11].uri=${services.cake-ai.url}
spring.cloud.gateway.server.webmvc.routes[11].predicates[0]=Path=/cake-ai/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[11].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[11].filters[1]=PreserveHostHeader
spring.cloud.gateway.server.webmvc.routes[11].filters[2]=SetRequestHeader=X-Forwarded-Prefix, /cake-ai

spring.cloud.gateway.server.webmvc.routes[12].id=order-service-docs
spring.cloud.gateway.server.webmvc.routes[12].uri=${services.order.url}
spring.cloud.gateway.server.webmvc.routes[12].predicates[0]=Path=/orders/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[12].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[12].filters[1]=PreserveHostHeader
spring.cloud.gateway.server.webmvc.routes[12].filters[2]=SetRequestHeader=X-Forwarded-Prefix, /orders

spring.cloud.gateway.server.webmvc.routes[13].id=chat-service-docs
spring.cloud.gateway.server.webmvc.routes[13].uri=${services.chat.url}
spring.cloud.gateway.server.webmvc.routes[13].predicates[0]=Path=/chat/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[13].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[13].filters[1]=PreserveHostHeader
spring.cloud.gateway.server.webmvc.routes[13].filters[2]=SetRequestHeader=X-Forwarded-Prefix, /chat

# =====================================
# Swagger UI API Gateway
# =====================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=Identity Service
springdoc.swagger-ui.urls[0].url=/identity/v3/api-docs
springdoc.swagger-ui.urls[1].name=Bakery Service
springdoc.swagger-ui.urls[1].url=/bakery/v3/api-docs
springdoc.swagger-ui.urls[2].name=Marketplace Service
springdoc.swagger-ui.urls[2].url=/marketplace/v3/api-docs
springdoc.swagger-ui.urls[3].name=Subscription Service
springdoc.swagger-ui.urls[3].url=/subscription/v3/api-docs
springdoc.swagger-ui.urls[4].name=Cake AI Service
springdoc.swagger-ui.urls[4].url=/cake-ai/v3/api-docs
springdoc.swagger-ui.urls[5].name=Order Service
springdoc.swagger-ui.urls[5].url=/orders/v3/api-docs
springdoc.swagger-ui.urls[6].name=Chat Service
springdoc.swagger-ui.urls[6].url=/chat/v3/api-docs

management.endpoints.web.exposure.include=health,info
