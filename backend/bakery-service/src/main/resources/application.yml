spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: bakery-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI}
          issuer-uri: ${IDENTITY_JWT_ISSUER:bakery-platform-identity}
          audiences: ${IDENTITY_JWT_USER_AUDIENCE:bakery-platform-api}
  datasource:
    url: ${BAKERY_DB_URL}
    username: ${BAKERY_DB_USERNAME}
    password: ${BAKERY_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
