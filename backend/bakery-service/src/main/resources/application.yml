spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: bakery-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI}
          issuer-uri: ${IDENTITY_JWT_ISSUER:bakery-platform-identity}
  datasource:
    url: ${BAKERY_DB_URL}
    username: ${BAKERY_DB_USERNAME}
    password: ${BAKERY_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 52MB

platform:
  remote:
    identity-url: ${IDENTITY_SERVICE_URL:http://localhost:8080}
    client-id: bakery-service
    client-secret: ${BAKERY_CLIENT_SECRET:}
    connect-timeout: 2s
    read-timeout: 5s

security:
  jwt:
    user-audience: ${IDENTITY_JWT_USER_AUDIENCE:bakery-platform-api}
    service-audience: ${IDENTITY_JWT_SERVICE_AUDIENCE:bakery-service}

clients:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8080}
    service-token: ${BAKERY_IDENTITY_SERVICE_TOKEN:}
  subscription:
    url: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8084}
    service-token: ${SUBSCRIPTION_SERVICE_TOKEN:}

storage:
  minio:
    endpoint: ${BAKERY_MINIO_ENDPOINT:}
    public-endpoint: ${BAKERY_MINIO_PUBLIC_ENDPOINT:}
    access-key: ${BAKERY_MINIO_ACCESS_KEY:}
    secret-key: ${BAKERY_MINIO_SECRET_KEY:}
    bucket: ${BAKERY_MINIO_BUCKET:bakery-media}

server:
  port: ${SERVER_PORT:8082}
