spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL}
    username: ${IDENTITY_DB_USERNAME}
    password: ${IDENTITY_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    private-key-path: ${IDENTITY_JWT_PRIVATE_KEY_PATH}
    public-key-path: ${IDENTITY_JWT_PUBLIC_KEY_PATH}
    key-id: ${IDENTITY_JWT_KEY_ID:bakery-identity-rs256-v1}
    issuer: ${IDENTITY_JWT_ISSUER:bakery-platform-identity}
    user-audience: ${IDENTITY_JWT_USER_AUDIENCE:bakery-platform-api}
    service-audience: ${IDENTITY_JWT_SERVICE_AUDIENCE:identity-service}
    access-token-ttl: ${IDENTITY_JWT_ACCESS_TOKEN_TTL:15m}
  auth:
    refresh-token-ttl: ${IDENTITY_REFRESH_TOKEN_TTL:7d}
    refresh-cookie-name: ${IDENTITY_REFRESH_COOKIE_NAME:refresh_token}
    refresh-cookie-path: /api/v1/auth
    refresh-cookie-secure: ${IDENTITY_REFRESH_COOKIE_SECURE:true}
    refresh-cookie-same-site: Lax
    bcrypt-strength: ${IDENTITY_BCRYPT_STRENGTH:12}
  cors:
    allowed-origins: ${IDENTITY_CORS_ALLOWED_ORIGINS:http://localhost:5173}


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

security.service-clients:
  clients:
    marketplace-service:
      secret-hash: ${MARKETPLACE_CLIENT_SECRET_HASH:}
      grants:
        bakery-service: "bakery:profile:read bakery:membership:read bakery:catalog:quote"
        subscription-service: "subscription:entitlement:read"
        cake-ai-service: "cake-ai:design:validate"
        order-service: "order:create-from-offer"
    order-service:
      secret-hash: ${ORDER_CLIENT_SECRET_HASH:}
      grants:
        marketplace-service: "marketplace:offer:read"
        identity-service: "identity:user:read identity:address:read"
        bakery-service: "bakery:profile:read bakery:membership:read"
    chat-service:
      secret-hash: ${CHAT_SERVICE_CLIENT_SECRET_HASH:}
      grants:
        marketplace-service: "marketplace:request:chat:authorize"
        bakery-service: "bakery:membership:read"

management.endpoint.health.group.readiness.include: readinessState,db
