spring:
  application:
    name: cake-ai-service
  datasource:
    url: ${CAKE_AI_DB_URL}
    username: ${CAKE_AI_DB_USERNAME}
    password: ${CAKE_AI_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 101MB
platform:
  security:
    audience: cake-ai-service
    jwk-set-uri: ${IDENTITY_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ${IDENTITY_JWT_ISSUER:bakery-platform-identity}
    user-audience: bakery-platform-api
  remote:
    identity-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8081}
    bakery-url: ${BAKERY_SERVICE_BASE_URL:http://localhost:8083}
    subscription-url: ${SUBSCRIPTION_SERVICE_BASE_URL:http://localhost:8084}
    cake-ai-url: ${CAKE_AI_SERVICE_BASE_URL:http://localhost:8085}
    order-url: ${ORDER_SERVICE_BASE_URL:http://localhost:8086}
    marketplace-url: ${MARKETPLACE_SERVICE_BASE_URL:http://localhost:8082}
    client-id: ${SERVICE_CLIENT_ID:cake-ai-service}
    client-secret: ${SERVICE_CLIENT_SECRET:}
    connect-timeout: 2s
    read-timeout: 5s
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

cake-ai:
  api-key: ${CAKE_AI_API_KEY:}
  provider-url: ${CAKE_AI_PROVIDER_URL:https://generativelanguage.googleapis.com/v1beta}
  image-model: ${CAKE_AI_IMAGE_MODEL:gemini-2.0-flash}
  moderation-model: ${CAKE_AI_MODERATION_MODEL:gemini-2.0-flash}
  connect-timeout: ${CAKE_AI_CONNECT_TIMEOUT:5s}
  read-timeout: ${CAKE_AI_READ_TIMEOUT:120s}
  workers: ${CAKE_AI_WORKERS:2}
  lease-duration: ${CAKE_AI_LEASE_DURATION:30m}
  firebase-project-id: ${CAKE_AI_FIREBASE_PROJECT_ID:${FIREBASE_PROJECT_ID:}}
  firebase-bucket: ${CAKE_AI_FIREBASE_BUCKET:${FIREBASE_STORAGE_BUCKET:}}
  scheduler-enabled: ${CAKE_AI_SCHEDULER_ENABLED:true}
  poll-delay-ms: ${CAKE_AI_POLL_DELAY_MS:1000}

