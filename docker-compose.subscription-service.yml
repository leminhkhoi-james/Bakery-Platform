services:
  subscription-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subscription_db
      POSTGRES_USER: ${SUBSCRIPTION_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD:-postgres}
    ports:
      - "${SUBSCRIPTION_DB_PORT:-5437}:5432"
    volumes:
      - subscription-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  subscription-storage:
    image: bakery-platform-minio:local
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SUBSCRIPTION_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SUBSCRIPTION_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${SUBSCRIPTION_MINIO_PORT:-9004}:9000"
      - "${SUBSCRIPTION_MINIO_CONSOLE_PORT:-9005}:9001"
    volumes:
      - subscription-storage-data:/data

  subscription-service:
    build:
      context: .
      dockerfile: backend/subscription-service/Dockerfile
    depends_on:
      subscription-db:
        condition: service_healthy
      subscription-storage:
        condition: service_started
    environment:
      SERVER_PORT: 8084
      SUBSCRIPTION_DB_URL: jdbc:postgresql://subscription-db:5432/subscription_db
      SUBSCRIPTION_DB_USERNAME: ${SUBSCRIPTION_DB_USERNAME:-postgres}
      SUBSCRIPTION_DB_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD:-postgres}
      IDENTITY_JWKS_URI: ${IDENTITY_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}
      IDENTITY_JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-bakery-platform-identity}
      IDENTITY_JWT_USER_AUDIENCE: ${IDENTITY_JWT_USER_AUDIENCE:-bakery-platform-api}
      IDENTITY_JWT_SERVICE_AUDIENCE: ${IDENTITY_JWT_SERVICE_AUDIENCE:-subscription-service}
      BAKERY_SERVICE_URL: ${BAKERY_SERVICE_URL:-http://host.docker.internal:8082}
      SUBSCRIPTION_BAKERY_SERVICE_TOKEN: ${SUBSCRIPTION_BAKERY_SERVICE_TOKEN:-}
      SUBSCRIPTION_MINIO_ENDPOINT: http://subscription-storage:9000
      SUBSCRIPTION_MINIO_PUBLIC_ENDPOINT: ${SUBSCRIPTION_MINIO_PUBLIC_ENDPOINT:-http://localhost:9004}
      SUBSCRIPTION_MINIO_ACCESS_KEY: ${SUBSCRIPTION_MINIO_ACCESS_KEY:-minioadmin}
      SUBSCRIPTION_MINIO_SECRET_KEY: ${SUBSCRIPTION_MINIO_SECRET_KEY:-minioadmin}
      SUBSCRIPTION_MINIO_BUCKET: subscription-proofs
      STORAGE_MINIO_REGION: ${STORAGE_MINIO_REGION:-us-east-1}
    ports:
      - "${SUBSCRIPTION_SERVICE_PORT:-8084}:8084"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  subscription-db-data:
  subscription-storage-data:
