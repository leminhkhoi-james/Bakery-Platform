name: bakery-platform
services:
  identity-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: ${IDENTITY_DB_USERNAME:-identity}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}
    volumes:
      - identity-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  marketplace-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketplace_db
      POSTGRES_USER: ${MARKETPLACE_DB_USERNAME:-marketplace}
      POSTGRES_PASSWORD: ${MARKETPLACE_DB_PASSWORD:?Set MARKETPLACE_DB_PASSWORD}
    volumes:
      - marketplace-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  identity-service:
    build:
      context: ./backend
      dockerfile: identity-service/Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      identity-db:
        condition: service_healthy
    environment:
      IDENTITY_DB_URL: jdbc:postgresql://identity-db:5432/identity_db
      IDENTITY_DB_USERNAME: ${IDENTITY_DB_USERNAME:-identity}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}
      IDENTITY_JWT_PRIVATE_KEY_PATH: /run/secrets/identity-private.pem
      IDENTITY_JWT_PUBLIC_KEY_PATH: /run/secrets/identity-public.pem
      IDENTITY_REFRESH_COOKIE_SECURE: "false"
      MARKETPLACE_CLIENT_SECRET_HASH: ${MARKETPLACE_CLIENT_SECRET_HASH:?Set MARKETPLACE_CLIENT_SECRET_HASH}
      ORDER_CLIENT_SECRET_HASH: ${ORDER_CLIENT_SECRET_HASH:-}
    volumes:
      - type: bind
        source: ${IDENTITY_JWT_PRIVATE_KEY_FILE:?Set IDENTITY_JWT_PRIVATE_KEY_FILE}
        target: /run/secrets/identity-private.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${IDENTITY_JWT_PUBLIC_KEY_FILE:?Set IDENTITY_JWT_PUBLIC_KEY_FILE}
        target: /run/secrets/identity-public.pem
        read_only: true
        bind:
          create_host_path: false
  marketplace-service:
    build:
      context: ./backend
      dockerfile: marketplace-service/Dockerfile
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      marketplace-db:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MARKETPLACE_DB_URL: jdbc:postgresql://marketplace-db:5432/marketplace_db
      MARKETPLACE_DB_USERNAME: ${MARKETPLACE_DB_USERNAME:-marketplace}
      MARKETPLACE_DB_PASSWORD: ${MARKETPLACE_DB_PASSWORD:?Set MARKETPLACE_DB_PASSWORD}
      IDENTITY_SERVICE_BASE_URL: http://identity-service:8080
      IDENTITY_JWK_SET_URI: http://identity-service:8080/.well-known/jwks.json
      SERVICE_CLIENT_ID: marketplace-service
      SERVICE_CLIENT_SECRET: ${MARKETPLACE_CLIENT_SECRET:?Set MARKETPLACE_CLIENT_SECRET}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:?Set FIREBASE_STORAGE_BUCKET}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
      BAKERY_SERVICE_BASE_URL: ${BAKERY_SERVICE_BASE_URL:-http://host.docker.internal:8083}
      SUBSCRIPTION_SERVICE_BASE_URL: ${SUBSCRIPTION_SERVICE_BASE_URL:-http://host.docker.internal:8084}
      CAKE_AI_SERVICE_BASE_URL: ${CAKE_AI_SERVICE_BASE_URL:-http://host.docker.internal:8085}
      ORDER_SERVICE_BASE_URL: ${ORDER_SERVICE_BASE_URL:-http://host.docker.internal:8086}
    volumes:
      - type: bind
        source: ${FIREBASE_CREDENTIALS_FILE:?Set FIREBASE_CREDENTIALS_FILE}
        target: /run/secrets/firebase.json
        read_only: true
        bind:
          create_host_path: false
volumes:
  identity-data:
  marketplace-data:
