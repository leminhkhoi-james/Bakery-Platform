services:
  bakery-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bakery_db
      POSTGRES_USER: ${BAKERY_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${BAKERY_DB_PASSWORD:-postgres}
    ports:
      - "${BAKERY_DB_PORT:-5436}:5432"
    volumes:
      - bakery-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  bakery-storage:
    image: bakery-platform-minio:local
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BAKERY_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${BAKERY_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${BAKERY_MINIO_PORT:-9002}:9000"
      - "${BAKERY_MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - bakery-storage-data:/data

  bakery-service:
    build:
      context: .
      dockerfile: backend/bakery-service/Dockerfile
    depends_on:
      bakery-db:
        condition: service_healthy
      bakery-storage:
        condition: service_started
    environment:
      SERVER_PORT: 8082
      BAKERY_DB_URL: jdbc:postgresql://bakery-db:5432/bakery_db
      BAKERY_DB_USERNAME: ${BAKERY_DB_USERNAME:-postgres}
      BAKERY_DB_PASSWORD: ${BAKERY_DB_PASSWORD:-postgres}
      IDENTITY_JWKS_URI: ${IDENTITY_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}
      IDENTITY_JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-bakery-platform-identity}
      IDENTITY_JWT_USER_AUDIENCE: ${IDENTITY_JWT_USER_AUDIENCE:-bakery-platform-api}
      IDENTITY_JWT_SERVICE_AUDIENCE: ${IDENTITY_JWT_SERVICE_AUDIENCE:-bakery-service}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://host.docker.internal:8080}
      BAKERY_IDENTITY_SERVICE_TOKEN: ${BAKERY_IDENTITY_SERVICE_TOKEN:-}
      SUBSCRIPTION_SERVICE_URL: ${SUBSCRIPTION_SERVICE_URL:-http://host.docker.internal:8084}
      SUBSCRIPTION_SERVICE_TOKEN: ${SUBSCRIPTION_SERVICE_TOKEN:-}
      BAKERY_MINIO_ENDPOINT: http://bakery-storage:9000
      BAKERY_MINIO_PUBLIC_ENDPOINT: ${BAKERY_MINIO_PUBLIC_ENDPOINT:-http://localhost:9002}
      BAKERY_MINIO_ACCESS_KEY: ${BAKERY_MINIO_ACCESS_KEY:-minioadmin}
      BAKERY_MINIO_SECRET_KEY: ${BAKERY_MINIO_SECRET_KEY:-minioadmin}
      BAKERY_MINIO_BUCKET: bakery-media
      STORAGE_MINIO_REGION: ${STORAGE_MINIO_REGION:-us-east-1}
    ports:
      - "${BAKERY_SERVICE_PORT:-8082}:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  bakery-db-data:
  bakery-storage-data:
